name: j7-sym

# Symbolizes panic/backtrace addresses from a J7 trial against the kernel that
# produced the boot image. Kernel addresses in XNU panics on these boards are
# unslid (kernel text base 0xfffffff007004000), so they can be looked up in the
# DEVELOPMENT kernel Mach-O straight away.
on:
  push:
    branches: [herolte]
    paths: [.github/workflows/j7-sym.yml]
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "xnu workflow run id whose xnu-kernel artifact is the booted kernel"
        default: "42484998413"
      addresses:
        description: "Space separated kernel addresses (pc, lr, caller, ...)"
        default: "0xfffffff00748fdb4 0xfffffff00748fd98 0xfffffff007abe48c"

permissions:
  actions: read
  contents: read

jobs:
  symbolize:
    runs-on: ubuntu-24.04
    steps:
      - name: Kernel from the xnu run
        uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: kernel
          run-id: ${{ inputs.kernel_run_id || '42484998413' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Symbolize
        env:
          ADDRESSES: ${{ inputs.addresses || '0xfffffff00748fdb4 0xfffffff00748fd98 0xfffffff007abe48c' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm > /dev/null

          pick() { for c in "$@"; do command -v "$c" >/dev/null 2>&1 && { echo "$c"; return; }; done; return 1; }
          SYM=$(pick llvm-symbolizer llvm-symbolizer-18 llvm-symbolizer-17 llvm-symbolizer-19 llvm-symbolizer-16)
          NM=$(pick llvm-nm llvm-nm-18 llvm-nm-17 llvm-nm-19 llvm-nm-16)
          OBJDUMP=$(pick llvm-objdump llvm-objdump-18 llvm-objdump-17 llvm-objdump-19 llvm-objdump-16)
          READOBJ=$(pick llvm-readobj llvm-readobj-18 llvm-readobj-17 llvm-readobj-19 llvm-readobj-16)

          ls -l kernel
          K=$(ls kernel/kernel*.a5xelte kernel/kernel*.herolte 2>/dev/null | head -1)
          [ -n "$K" ] || { echo "::error title=j7-sym::no kernel Mach-O in the artifact"; exit 1; }
          echo "kernel: $K ($(stat -c %s "$K") bytes)"

          $READOBJ --macho-segment "$K" > /tmp/segments.txt 2>&1 || true
          $NM -n --defined-only "$K" > /tmp/symbols.txt 2>&1 || true
          for a in $ADDRESSES; do
            $SYM --obj="$K" --inlines --demangle --functions=linkage "$a" > "/tmp/sym-$a.txt" 2>&1 || true
            python3 - "$a" <<'PY' > "/tmp/range-$a.txt" 2>&1 || true
          import sys
          pc = int(sys.argv[1], 16)
          print(hex(pc - 0x40), hex(pc + 0x40))
          PY
            set -- $(cat "/tmp/range-$a.txt")
            $OBJDUMP -d --no-show-raw-insn --start-address="$1" --stop-address="$2" "$K" > "/tmp/dis-$a.txt" 2>&1 || true
          done

          python3 - "$K" "$ADDRESSES" <<'PY' > /tmp/report.txt
          import sys

          kernel, addresses = sys.argv[1], sys.argv[2].split()

          def read(path):
              try:
                  return open(path, errors='replace').read().splitlines()
              except OSError:
                  return []

          syms = []
          for line in read('/tmp/symbols.txt'):
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      syms.append((int(parts[0], 16), parts[-1]))
                  except ValueError:
                      pass
          syms.sort()

          out = [f'### j7-sym', '', f'kernel: `{kernel}`', '', '#### segments', '```']

          seg = {}
          for line in read('/tmp/segments.txt'):
              s = line.strip()
              for key in ('Name:', 'Address:', 'Size:', 'FileOffset:'):
                  if s.startswith(key):
                      seg[key[:-1]] = s.split(':', 1)[1].strip()
              if 'FileOffset' in seg and {'Name', 'Address', 'Size'} <= seg.keys():
                  out.append(f"{seg['Name']:<20} vmaddr={seg['Address']:<20} size={seg['Size']:<12} off={seg['FileOffset']}")
                  seg = {}

          out += ['```', '', '#### addresses', '```']

          for addr in addresses:
              value = int(addr, 16)
              frames = ['  '.join(f.split(': ', 1)) for f in read(f'/tmp/sym-{addr}.txt') if f.strip()]
              text = ' ; '.join(frames) if frames else '(no symbolizer match)'
              below = [s for s in syms if s[0] <= value]
              near = f'{below[-1][1]} + 0x{value - below[-1][0]:x}' if below else '?'
              out.append(f'{addr}  {near}')
              out.append(f'    symbolizer: {text}')
              for line in read(f'/tmp/dis-{addr}.txt'):
                  if line.strip():
                      out.append(f'    {line}')
              out.append('')

          out.append('```')
          print('\n'.join(out))
          PY

          cat /tmp/report.txt >> "$GITHUB_STEP_SUMMARY"

          # The run summary needs a login for some viewers; mirror the report as an
          # annotation, which is public on a public repository.
          python3 - <<'PY'
          text = open('/tmp/report.txt', errors='replace').read()
          text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print(f'::notice title=j7-sym report::{text[:40000]}')
          PY
